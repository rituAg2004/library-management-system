name: Python Tests


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flake8

      - name: Lint with flake8
        run: python -m flake8 library.py test_library.py main.py test_main.py

      - name: Run tests
        run: python -m pytest -v

      - name: Package application
        run: |
          mkdir dist
          zip dist/library-app.zip library.py main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-app
          path: dist/library-app.zip
